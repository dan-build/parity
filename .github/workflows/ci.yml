# Every push and pull request: lint, types, tests, the verdict eval and a production build.
# Runs on saved data only: no API key, no credits.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint app components lib scripts
      - name: Types
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Verdict eval (golden set + baseline + method version)
        run: npm run eval
      - name: Production build
        run: npm run build
